<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0F14">
<title>LocalShare</title>
<style>
:root{--bg:#0B0F14;--surface:#131A22;--surface2:#1B2430;--outline:#263241;--text:#E6EDF3;--muted:#8B98A9;--primary:#7C9CFF;--onprimary:#0B1230;--accent:#46E0B8;--danger:#FF6B7A;--r:18px}
@media (prefers-color-scheme:light){:root{--bg:#F6F8FB;--surface:#FFFFFF;--surface2:#EEF2F7;--outline:#D8E0EA;--text:#101820;--muted:#5B6B7E;--primary:#4A6CF7;--onprimary:#FFFFFF;--accent:#12A98A;--danger:#D93A4B}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg{display:block}
.hide{display:none!important}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover,.icon-btn.on{background:var(--surface2);color:var(--text)}
.btn{background:var(--primary);color:var(--onprimary);border-radius:999px;padding:12px 22px;font-weight:600}
.btn:disabled{opacity:.5}
.field{width:100%;background:var(--surface2);border:1px solid var(--outline);border-radius:14px;padding:13px 14px;outline:none}
.field:focus{border-color:var(--primary)}
/* login */
#login{min-height:100%;display:grid;place-items:center;padding:20px}
.card{background:var(--surface);border:1px solid var(--outline);border-radius:24px;padding:28px;width:min(420px,100%)}
.logo{width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,var(--primary),var(--accent));display:grid;place-items:center;color:var(--onprimary);margin-bottom:16px}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.card .field{margin-bottom:12px}
.pwrap{position:relative}.pwrap .field{padding-right:48px}
.eye{position:absolute;right:6px;top:4px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.eye:hover{background:var(--surface);color:var(--text)}
.err{color:var(--danger);min-height:20px;margin:4px 0 10px;font-size:14px}
/* app */
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:var(--bg);border-bottom:1px solid var(--outline)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.brand .logo{width:34px;height:34px;border-radius:11px;margin:0}
.search{flex:1;min-width:0;max-width:420px;margin-left:auto}
.search input{width:100%;background:var(--surface);border:1px solid var(--outline);border-radius:999px;padding:9px 16px;outline:none}
.search input:focus{border-color:var(--primary)}
#crumbs{display:flex;align-items:center;gap:2px;padding:12px 14px 4px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
#crumbs::-webkit-scrollbar{display:none}
#crumbs button{padding:6px 12px;border-radius:999px;color:var(--muted)}
#crumbs button:last-child{color:var(--text);font-weight:600}
#crumbs button:hover{background:var(--surface2)}
#crumbs i{color:var(--outline);font-style:normal}
main{flex:1;overflow:auto;padding:8px 14px 110px}
.bar{display:flex;align-items:center;gap:8px;padding:4px 14px 0;color:var(--muted);font-size:13px}
.bar select{background:var(--surface);border:1px solid var(--outline);border-radius:999px;padding:5px 10px;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{background:var(--surface);border:1px solid var(--outline);border-radius:var(--r);overflow:hidden;text-align:left;display:flex;flex-direction:column;transition:transform .12s,border-color .12s}
.item:hover{border-color:var(--primary);transform:translateY(-2px)}
.thumb{aspect-ratio:4/3;background:var(--surface2);display:grid;place-items:center;position:relative;overflow:hidden}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}
.thumb .ext{font-weight:800;letter-spacing:.5px;font-size:18px;color:var(--c,var(--muted))}
.thumb svg{color:var(--c,var(--muted))}
.thumb .play{position:absolute;right:8px;bottom:8px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.meta{padding:10px 12px}
.name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info{color:var(--muted);font-size:12px;margin-top:2px}
.list .grid{grid-template-columns:1fr;gap:6px}
.list .item{flex-direction:row;align-items:center;border-radius:14px}
.list .thumb{width:52px;height:52px;aspect-ratio:auto;border-radius:12px;margin:6px;flex:none}
.list .thumb .ext{font-size:12px}.list .play{display:none}
.list .meta{flex:1;min-width:0}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
/* viewer */
#viewer{position:fixed;inset:0;z-index:50;background:rgba(5,8,12,.96);display:flex;flex-direction:column;color:#E6EDF3}
#vbar{display:flex;align-items:center;gap:6px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top))}
#vbar .icon-btn{color:#C7D0DC}
#vtitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
#vbody{flex:1;min-height:0;display:grid;place-items:center;position:relative;overflow:auto}
#vbody img,#vbody video{max-width:100%;max-height:100%;object-fit:contain}
#vbody video{width:100%;height:100%;background:#000}
#vbody audio{width:min(520px,90%)}
#vbody pre{align-self:start;justify-self:stretch;margin:0;padding:16px;white-space:pre-wrap;word-break:break-word;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#D6DEE8;width:100%}
#pdf{width:100%;height:100%;overflow:auto;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:10px;align-self:start}
#pdf canvas{background:#fff;max-width:100%;box-shadow:0 2px 12px rgba(0,0,0,.5)}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;z-index:2}
.nav.l{left:10px}.nav.r{right:10px}
/* toast */
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--outline);padding:10px 18px;border-radius:999px;z-index:70;max-width:90vw}
/* game dock */
#dock{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:40;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
#fab{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));color:var(--onprimary);display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#panel{width:min(340px,calc(100vw - 28px));background:var(--surface);border:1px solid var(--outline);border-radius:22px;overflow:hidden;box-shadow:0 12px 36px rgba(0,0,0,.4)}
#phead{display:flex;align-items:center;padding:8px 8px 8px 16px;gap:8px}
#phead b{flex:1}#phead span{color:var(--muted);font-size:12px}
#stage{position:relative;aspect-ratio:1;background:var(--surface2)}
#cv{width:100%;height:100%;display:block;touch-action:none}
#lb{position:absolute;left:8px;top:8px;font-size:11px;line-height:1.5;background:rgba(0,0,0,.45);color:#fff;padding:6px 9px;border-radius:10px;pointer-events:none;min-width:110px}
#hint{padding:8px 14px 12px;color:var(--muted);font-size:12px}
#blocked{min-height:100%;display:grid;place-items:center;text-align:center;padding:24px}
</style>
</head>
<body>

<section id="login" class="hide">
  <form class="card" id="lf">
    <div class="logo" id="logo1"></div>
    <h1>LocalShare</h1>
    <p class="sub" id="lsub">Enter your name to join.</p>
    <input class="field" id="lname" placeholder="Your name" maxlength="20" autocomplete="nickname">
    <div class="pwrap hide" id="pwrap"><input class="field" id="lpw" type="password" placeholder="Password" autocomplete="current-password"><button type="button" class="eye" id="eye" aria-label="Show password"></button></div>
    <div class="err" id="lerr"></div>
    <button class="btn" id="lgo" style="width:100%">Join</button>
  </form>
</section>

<section id="blocked" class="hide"><div><div class="logo" style="margin:0 auto 16px;background:var(--danger)" id="logo2"></div><h1>Access blocked</h1><p class="sub">The host has blocked this device from the network.</p></div></section>

<section id="app" class="hide">
  <header>
    <div class="brand"><div class="logo" id="logo3"></div><span class="hide-sm">LocalShare</span></div>
    <div class="search"><input id="q" type="search" placeholder="Search this folder"></div>
    <button class="icon-btn" id="vt" title="Grid / list"></button>
    <button class="icon-btn" id="lo" title="Leave"></button>
  </header>
  <div id="crumbs"></div>
  <div class="bar"><span id="count"></span><select id="sort"><option value="name">Name</option><option value="date">Newest</option><option value="size">Largest</option><option value="type">Type</option></select></div>
  <main id="main"></main>
</section>

<div id="viewer" class="hide">
  <div id="vbar"><button class="icon-btn" id="vx"></button><div id="vtitle"></div><a class="icon-btn" id="vdl" download></a></div>
  <div id="vbody"></div>
</div>

<div id="dock" class="hide">
  <div id="panel" class="hide">
    <div id="phead"><b>Orb Arena</b><span id="pcount"></span><button class="icon-btn" id="pclose"></button></div>
    <div id="stage"><canvas id="cv"></canvas><div id="lb"></div></div>
    <div id="hint">Drag or use WASD / arrows. Eat orbs, then eat smaller players.</div>
  </div>
  <button id="fab" title="Play"></button>
</div>
<div id="toast" class="hide"></div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const P={folder:"M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z",
 music:"M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z",
 play:"M8 5v14l11-7z",dl:"M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z",
 x:"M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z",
 l:"M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z",r:"M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z",
 grid:"M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z",list:"M3 5h18v2H3V5zm0 6h18v2H3v-2zm0 6h18v2H3v-2z",
 pad:"M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4-3c-.83 0-1.5-.67-1.5-1.5S18.67 9 19.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z",
 eye:"M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z",
 eyeoff:"M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z",
 out:"M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z",
 wifi:"M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3a4.237 4.237 0 00-6 0zm-4-4l2 2a7.074 7.074 0 0110 0l2-2C15.14 9.14 8.87 9.14 5 13z"};
const svg=(p,s=24)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="currentColor"><path d="${p}"/></svg>`;
const COL={pdf:"#FF6B6B",zip:"#F2B84B",rar:"#F2B84B","7z":"#F2B84B",apk:"#46E0B8",txt:"#8B98A9",doc:"#5B8CFF",docx:"#5B8CFF",xls:"#3FBF7F",xlsx:"#3FBF7F",ppt:"#FF9A5C",pptx:"#FF9A5C"};
for(const id of["logo1","logo3"])$("#"+id).innerHTML=svg(P.wifi,id==="logo1"?30:20);
$("#logo2").innerHTML=svg(P.x,30);
$("#vx").innerHTML=svg(P.x);$("#vdl").innerHTML=svg(P.dl);$("#lo").innerHTML=svg(P.out);$("#fab").innerHTML=svg(P.pad,28);$("#pclose").innerHTML=svg(P.x);
$("#eye").innerHTML=svg(P.eye);
$("#eye").onclick=()=>{const p=$("#lpw"),h=p.type==="password";p.type=h?"text":"password";$("#eye").innerHTML=svg(h?P.eyeoff:P.eye);$("#eye").setAttribute("aria-label",h?"Hide password":"Show password")};

const rid=()=>{const a=new Uint8Array(12);(crypto.getRandomValues?crypto.getRandomValues(a):a.forEach((_,i)=>a[i]=Math.random()*256));return Array.from(a,b=>b.toString(16).padStart(2,"0")).join("")};
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const DEV=store.get("ls_dev")||(()=>{const d=rid();store.set("ls_dev",d);return d})();
let ME={name:"",host:false},INFO={},view=store.get("ls_view")||"grid",entries=[],cur="",pendingPing=null;

async function J(url,opt){
  let r;try{r=await fetch(url,opt)}catch(e){return{ok:false,status:0,d:{error:"offline"}}}
  let d={};try{d=await r.json()}catch(e){}
  if(r.status===403&&d.error==="blocked"){show("blocked");stopAll()}
  else if(r.status===401&&d.error==="auth"&&ME.name){ME.name="";showLogin("Session ended. Please sign in again.")}
  return{ok:r.ok,status:r.status,d};
}
function show(id){for(const s of["login","blocked","app"])$("#"+s).classList.toggle("hide",s!==id);$("#dock").classList.toggle("hide",!(id==="app"&&INFO.gameEnabled))}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.remove("hide");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add("hide"),2600)}
function stopAll(){clearInterval(pendingPing);closeViewer();gameClose()}

/* ---------- login / boot ---------- */
function showLogin(msg){
  show("login");stopAll();
  $("#pwrap").classList.toggle("hide",!INFO.needPassword);
  $("#lsub").textContent=INFO.needPassword?"This folder is password protected.":"Enter your name to join.";
  $("#lname").value=store.get("ls_name")||"";$("#lerr").textContent=msg||"";
}
$("#lf").onsubmit=async e=>{
  e.preventDefault();const b=$("#lgo");b.disabled=true;$("#lerr").textContent="";
  const body=new URLSearchParams({name:$("#lname").value,password:$("#lpw").value,device:DEV});
  const r=await J("/api/login",{method:"POST",body});b.disabled=false;
  if(r.ok){store.set("ls_name",$("#lname").value);$("#lpw").value="";await boot()}
  else $("#lerr").textContent=r.status===429&&r.d.retry?`Too many attempts. Try again in ${r.d.retry}s.`:(r.d.error||"Could not connect");
};
async function boot(){
  if(location.hash.startsWith("#ht=")){ // in-app host browser
    const t=location.hash.slice(4);history.replaceState(null,"","#/");
    await J("/api/login",{method:"POST",body:new URLSearchParams({hostToken:t,name:"Host",device:"host"})});
  }
  const r=await J("/api/info");if(!r.ok)return;INFO=r.d;
  if(!INFO.authed)return showLogin();
  ME={name:INFO.name,host:INFO.host};enter();
}
function enter(){
  show("app");$("#vt").innerHTML=svg(view==="grid"?P.list:P.grid);
  clearInterval(pendingPing);pendingPing=setInterval(ping,10000);
  go(decodeURIComponent(location.hash.replace(/^#\/?/,"")));
}
async function ping(){const r=await J("/api/ping");if(r.status===429)showLogin("The room is full right now. Try again in a moment.")}
$("#lo").onclick=async()=>{await J("/api/logout",{method:"POST"});ME.name="";const r=await J("/api/info");INFO=r.d;showLogin()};

/* ---------- browsing ---------- */
const fmt=n=>n<1024?n+" B":n<1048576?(n/1024).toFixed(0)+" KB":n<1073741824?(n/1048576).toFixed(1)+" MB":(n/1073741824).toFixed(2)+" GB";
const dt=ms=>ms?new Date(ms).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}):"";
const url=(p,dl)=>"/api/file?path="+encodeURIComponent(p)+(dl?"&dl=1":"");
const join=(a,b)=>a?a+"/"+b:b;
async function go(p){
  const r=await J("/api/list?path="+encodeURIComponent(p));
  if(!r.ok){if(r.status===404)toast("Folder not found");if(p)return go("");return}
  cur=r.d.path;entries=r.d.entries;
  if(decodeURIComponent(location.hash.replace(/^#\/?/,""))!==cur)history.replaceState(null,"","#/"+cur.split("/").map(encodeURIComponent).join("/"));
  render();$("#main").scrollTop=0;
}
window.addEventListener("hashchange",()=>{if(ME.name)go(decodeURIComponent(location.hash.replace(/^#\/?/,"")))});
function crumbs(){
  const c=$("#crumbs");c.innerHTML="";const parts=cur?cur.split("/"):[];let acc="";
  const add=(t,p)=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>{location.hash="#/"+p.split("/").map(encodeURIComponent).join("/")};c.appendChild(b)};
  add("Home","");parts.forEach(s=>{acc=join(acc,s);const i=document.createElement("i");i.textContent="›";c.appendChild(i);add(s,acc)});
}
const sorters={name:(a,b)=>a.n.localeCompare(b.n,undefined,{numeric:true,sensitivity:"base"}),date:(a,b)=>b.m-a.m,size:(a,b)=>b.s-a.s,type:(a,b)=>a.k.localeCompare(b.k)||sorters.name(a,b)};
let io=null;
function render(){
  crumbs();
  const q=$("#q").value.trim().toLowerCase(),sk=$("#sort").value;
  const list=entries.filter(e=>!q||e.n.toLowerCase().includes(q)).sort((a,b)=>(b.d-a.d)||sorters[sk](a,b));
  $("#count").textContent=list.length+" item"+(list.length===1?"":"s");
  const m=$("#main");m.className=view==="list"?"list":"";m.innerHTML="";
  if(!list.length){m.innerHTML='<div class="empty">This folder is empty</div>';return}
  const g=document.createElement("div");g.className="grid";m.appendChild(g);
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){const t=x.target;t.src=t.dataset.src;io.unobserve(t)}}),{root:m,rootMargin:"300px"});
  list.forEach(e=>{
    const p=join(cur,e.n),b=document.createElement("button");b.className="item";
    const th=document.createElement("div");th.className="thumb";
    const ext=(e.n.split(".").pop()||"").toUpperCase().slice(0,4);
    if(e.d){th.style.setProperty("--c","var(--primary)");th.innerHTML=svg(P.folder,44)}
    else if(e.k==="image"){const i=document.createElement("img");i.alt="";i.decoding="async";i.dataset.src=url(p);th.appendChild(i);io.observe(i)}
    else if(e.k==="video"){const v=document.createElement("video");v.muted=true;v.preload="metadata";v.playsInline=true;v.dataset.src=url(p)+"#t=0.5";th.appendChild(v);io.observe(v);th.insertAdjacentHTML("beforeend",'<div class="play">'+svg(P.play,18)+"</div>")}
    else if(e.k==="audio"){th.style.setProperty("--c","var(--accent)");th.innerHTML=svg(P.music,40)}
    else{th.style.setProperty("--c",COL[ext.toLowerCase()]||"var(--muted)");th.innerHTML='<span class="ext">'+(ext||"FILE").replace(/</g,"")+"</span>"}
    const meta=document.createElement("div");meta.className="meta";
    const n=document.createElement("div");n.className="name";n.textContent=e.n;n.title=e.n;
    const inf=document.createElement("div");inf.className="info";inf.textContent=e.d?"Folder":fmt(e.s)+" · "+dt(e.m);
    meta.append(n,inf);b.append(th,meta);
    b.onclick=()=>{if(e.d)location.hash="#/"+p.split("/").map(encodeURIComponent).join("/");else open(e)};
    g.appendChild(b);
  });
}
$("#q").oninput=render;$("#sort").onchange=render;
$("#vt").onclick=()=>{view=view==="grid"?"list":"grid";store.set("ls_view",view);$("#vt").innerHTML=svg(view==="grid"?P.list:P.grid);render()};

/* ---------- viewer ---------- */
let vlist=[],vi=0,pdfLib=null;
const viewable=e=>!e.d&&["image","video","audio","pdf","text"].includes(e.k);
function open(e){
  if(!viewable(e)){const a=document.createElement("a");a.href=url(join(cur,e.n),1);a.click();return}
  const q=$("#q").value.trim().toLowerCase(),sk=$("#sort").value;
  vlist=entries.filter(x=>viewable(x)&&(!q||x.n.toLowerCase().includes(q))).sort((a,b)=>sorters[sk](a,b));
  vi=Math.max(0,vlist.findIndex(x=>x.n===e.n));$("#viewer").classList.remove("hide");showItem();
}
function closeViewer(){$("#viewer").classList.add("hide");$("#vbody").innerHTML=""}
$("#vx").onclick=closeViewer;
function step(d){if(vlist.length<2)return;vi=(vi+d+vlist.length)%vlist.length;showItem()}
async function showItem(){
  const e=vlist[vi],p=join(cur,e.n),b=$("#vbody");b.innerHTML="";b.scrollTop=0;
  $("#vtitle").textContent=e.n;$("#vdl").href=url(p,1);$("#vdl").setAttribute("download",e.n);
  const my=++showItem.n;
  if(vlist.length>1)b.insertAdjacentHTML("beforeend",`<button class="nav l" id="pv">${svg(P.l)}</button><button class="nav r" id="nx">${svg(P.r)}</button>`);
  if(vlist.length>1){$("#pv").onclick=()=>step(-1);$("#nx").onclick=()=>step(1)}
  if(e.k==="image"){const i=new Image();i.src=url(p);b.appendChild(i)}
  else if(e.k==="video"){const v=document.createElement("video");v.controls=true;v.autoplay=true;v.playsInline=true;v.src=url(p);b.appendChild(v)}
  else if(e.k==="audio"){const w=document.createElement("div");w.style.cssText="display:grid;gap:18px;justify-items:center;width:100%";w.innerHTML=`<div style="color:var(--accent)">${svg(P.music,96)}</div>`;const a=document.createElement("audio");a.controls=true;a.autoplay=true;a.src=url(p);w.appendChild(a);b.appendChild(w)}
  else if(e.k==="text"){
    const pre=document.createElement("pre");pre.textContent="Loading…";b.appendChild(pre);
    try{const r=await fetch(url(p),{headers:{Range:"bytes=0-524287"}});const t=await r.text();if(my!==showItem.n)return;pre.textContent=t+(e.s>524288?"\n\n… (showing first 512 KB — download for the full file)":"")}catch(x){pre.textContent="Could not load file."}
  }else if(e.k==="pdf")await showPdf(p,b,my);
}
showItem.n=0;
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function showPdf(p,b,my){
  const box=document.createElement("div");box.id="pdf";box.textContent="Loading PDF…";box.style.color="#8B98A9";b.appendChild(box);
  try{
    if(!pdfLib){await loadScript("/static/pdf.min.js");pdfLib=window.pdfjsLib;pdfLib.GlobalWorkerOptions.workerSrc="/static/pdf.worker.min.js"}
    const doc=await pdfLib.getDocument({url:url(p)}).promise;if(my!==showItem.n)return;
    box.textContent="";box.style.color="";
    const w=Math.min(box.clientWidth-8,900),dpr=Math.min(window.devicePixelRatio||1,2.5),cvs=[];
    const obs=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting&&!x.target._done){x.target._done=1;draw(x.target)}}),{root:box,rootMargin:"600px"});
    async function draw(c){const pg=await doc.getPage(c._n);const vp0=pg.getViewport({scale:1}),sc=w/vp0.width,vp=pg.getViewport({scale:sc*dpr});c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise}
    const first=await doc.getPage(1),v1=first.getViewport({scale:1});
    for(let i=1;i<=doc.numPages;i++){const c=document.createElement("canvas");c._n=i;c.style.width=w+"px";c.style.height=(w*v1.height/v1.width)+"px";box.appendChild(c);obs.observe(c)}
  }catch(x){box.innerHTML='Could not render this PDF here. <a style="color:var(--primary)" href="'+url(p,1)+'">Download it</a>.'}
}
addEventListener("keydown",e=>{
  if(!$("#viewer").classList.contains("hide")){if(e.key==="Escape")closeViewer();else if(e.key==="ArrowLeft")step(-1);else if(e.key==="ArrowRight")step(1)}
});
let sx=0;$("#vbody").addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
$("#vbody").addEventListener("touchend",e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>70&&vlist[vi]&&vlist[vi].k==="image")step(d>0?-1:1)},{passive:true});

/* ---------- Orb Arena (multiplayer game) ---------- */
const G={ws:null,open:false,me:null,W:1200,H:1200,ps:[],os:[],ix:0,iy:0,sx:0,sy:0,keys:{},drag:null,raf:0,pt:0,lastSend:0,cam:{x:600,y:600,r:14}};
$("#fab").onclick=()=>{$("#panel").classList.remove("hide");$("#fab").classList.add("hide");G.open=true;gameConnect();loop()};
$("#pclose").onclick=gameClose;
function gameClose(){G.open=false;$("#panel").classList.add("hide");$("#fab").classList.remove("hide");cancelAnimationFrame(G.raf);clearInterval(G.pt);if(G.ws){G.ws.onclose=null;G.ws.close();G.ws=null}}
function gameConnect(){
  if(G.ws||!G.open)return;
  const ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws");G.ws=ws;
  ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.t==="hello"){G.me=m.id;G.W=m.w;G.H=m.h}else if(m.t==="s"){G.ps=m.p;G.os=m.o}};
  ws.onopen=()=>{clearInterval(G.pt);G.pt=setInterval(()=>{if(ws.readyState===1)ws.send("p")},20000);G.sx=G.sy=NaN};
  ws.onclose=()=>{G.ws=null;clearInterval(G.pt);if(G.open)setTimeout(gameConnect,1500)};
}
function inputVec(){
  let x=0,y=0;const k=G.keys;
  if(k.ArrowLeft||k.a)x-=1;if(k.ArrowRight||k.d)x+=1;if(k.ArrowUp||k.w)y-=1;if(k.ArrowDown||k.s)y+=1;
  if(G.drag){x=G.drag.x;y=G.drag.y}
  return[x,y];
}
function pushInput(){
  const[x,y]=inputVec();if(x===G.sx&&y===G.sy)return;
  if(G.ws&&G.ws.readyState===1){G.ws.send("m "+x.toFixed(2)+" "+y.toFixed(2));G.sx=x;G.sy=y}
}
addEventListener("keydown",e=>{if(!G.open||/INPUT/.test(document.activeElement.tagName))return;const k=e.key.length===1?e.key.toLowerCase():e.key;if("wasd".includes(k)||k.startsWith("Arrow")){G.keys[k]=true;e.preventDefault()}});
addEventListener("keyup",e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;delete G.keys[k]});
const cv=$("#cv");
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);G.drag={ox:e.clientX,oy:e.clientY,x:0,y:0}});
cv.addEventListener("pointermove",e=>{const d=G.drag;if(!d)return;const dx=e.clientX-d.ox,dy=e.clientY-d.oy,m=Math.hypot(dx,dy);const f=Math.min(m/40,1);d.x=m?dx/m*f:0;d.y=m?dy/m*f:0});
const endDrag=()=>{G.drag=null};cv.addEventListener("pointerup",endDrag);cv.addEventListener("pointercancel",endDrag);
let lbT=0;
function loop(){
  G.raf=requestAnimationFrame(loop);pushInput();
  const c=cv,rc=c.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);
  if(c.width!==Math.round(rc.width*dpr)){c.width=Math.round(rc.width*dpr);c.height=Math.round(rc.height*dpr)}
  const x=c.getContext("2d"),S=c.width,me=G.ps.find(p=>p[0]===G.me);
  if(me){G.cam.x+=(me[2]-G.cam.x)*.25;G.cam.y+=(me[3]-G.cam.y)*.25;G.cam.r+=(me[4]-G.cam.r)*.1}
  const span=300+G.cam.r*5,k=S/span,cs=getComputedStyle(document.documentElement);
  x.fillStyle=cs.getPropertyValue("--surface2");x.fillRect(0,0,S,S);
  x.save();x.translate(S/2-G.cam.x*k,S/2-G.cam.y*k);
  x.fillStyle=cs.getPropertyValue("--bg");x.fillRect(0,0,G.W*k,G.H*k);
  x.strokeStyle=cs.getPropertyValue("--outline");x.lineWidth=1;x.beginPath();
  for(let g=0;g<=G.W;g+=100){x.moveTo(g*k,0);x.lineTo(g*k,G.H*k);x.moveTo(0,g*k);x.lineTo(G.W*k,g*k)}x.stroke();
  x.lineWidth=3;x.strokeStyle=cs.getPropertyValue("--primary");x.strokeRect(0,0,G.W*k,G.H*k);
  for(const o of G.os){x.fillStyle=`hsl(${o[2]} 90% 62%)`;x.beginPath();x.arc(o[0]*k,o[1]*k,Math.max(2,4*k),0,7);x.fill()}
  const sorted=G.ps.slice().sort((a,b)=>a[4]-b[4]);
  for(const p of sorted){
    x.fillStyle=`hsl(${p[5]} 80% 58%)`;x.beginPath();x.arc(p[2]*k,p[3]*k,p[4]*k,0,7);x.fill();
    if(p[0]===G.me){x.lineWidth=2.5;x.strokeStyle="#fff";x.stroke()}
    x.fillStyle="#fff";x.font=`600 ${Math.max(10,Math.min(p[4]*k*.7,16))*1}px system-ui`;x.textAlign="center";x.textBaseline="middle";x.fillText(p[1],p[2]*k,p[3]*k);
  }
  x.restore();
  const now=performance.now();
  if(now-lbT>400){lbT=now;
    const top=G.ps.slice().sort((a,b)=>b[4]-a[4]).slice(0,5);
    $("#lb").innerHTML=top.map(p=>`<div${p[0]===G.me?' style="color:#46E0B8"':""}>${Math.max(0,Math.round((p[4]*p[4]-196)/9))} · ${p[1].replace(/</g,"&lt;")}</div>`).join("")||"Connecting…";
    $("#pcount").textContent=G.ps.length+" playing";
  }
}

boot();
</script>
